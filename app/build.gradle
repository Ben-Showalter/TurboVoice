plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing key, kept out of git: a `keystore.properties` at the repo root
// (see README, "Publishing a release"). Without it, release builds are left
// unsigned so fresh checkouts still build.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = null
if (keystorePropsFile.exists()) {
    keystoreProps = new Properties()
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.turbovoice.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.turbovoice.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Every published release must be signed with this same key, and
            // carry a higher versionCode, or devices refuse the in-app update.
            if (keystoreProps != null) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // For Groq's Whisper API (cloud voice-to-text) — same version pin as
    // TurboText, for the same reason: 4.x rather than 5.x's split
    // JVM/Android artifacts.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
